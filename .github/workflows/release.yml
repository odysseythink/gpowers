name: release

on:
  push:
    tags: [v*]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Build binaries
        run: |
          make build
          cp build/install .
          cp build/_gpowers-rewrite-browser bin/

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y bats jq python3 rsync git shellcheck

      - name: Run full test suite (excluding smoke)
        run: ./tests/run.sh all || ./tests/run.sh unit

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      - name: Run GoReleaser
        run: |
          goreleaser release --clean --verbose 2>&1 | tee /tmp/goreleaser.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Show GoReleaser logs on failure
        if: failure()
        run: |
          echo "=== GoReleaser failure ==="
          cat /tmp/goreleaser.log 2>/dev/null || true
          echo "=== dist/ contents ==="
          ls -la dist/ 2>/dev/null || true
          echo "=== dist/*.json ==="
          cat dist/*.json 2>/dev/null || true
