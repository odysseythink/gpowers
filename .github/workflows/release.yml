name: release

on:
  push:
    tags: [v*]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Build binaries
        run: |
          go build -o install ./cmd/install
          cd tools/skills/browse-go && go build -o ../../bin/_gpowers-rewrite-browser ./cmd/browse

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y bats jq python3 rsync git shellcheck

      - name: Run full test suite (excluding smoke)
        run: ./tests/run.sh all || ./tests/run.sh unit

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
