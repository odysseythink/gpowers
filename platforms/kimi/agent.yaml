# gpowers Kimi agent.yaml
# Opt in via:  kimi --agent-file ./platforms/kimi/agent.yaml
#
# Caveat: Kimi subagents inheritance is overwrite, not merge.
# We re-declare the built-in subagents (coder/explore/plan) so they remain available.

version: 1
agent:
  extend: default
  subagents:
    coder:
      path: /Users/ranwei/.local/share/uv/tools/kimi-cli/lib/python3.13/site-packages/kimi_cli/agents/default/coder.yaml
      description: "Kimi built-in coder subagent."
    explore:
      path: /Users/ranwei/.local/share/uv/tools/kimi-cli/lib/python3.13/site-packages/kimi_cli/agents/default/explore.yaml
      description: "Kimi built-in codebase explorer."
    plan:
      path: /Users/ranwei/.local/share/uv/tools/kimi-cli/lib/python3.13/site-packages/kimi_cli/agents/default/plan.yaml
      description: "Kimi built-in planner."
    oracle:
      path: ./oracle.yaml
      description: "Read-only strategic advisor — dispatched for complex reasoning and Ultrawork verification."
